# nginx del frontend React (prod). Sirve el SPA y proxya API/archivos/realtime
# al nginx de ERPNext (servicio "frontend" del stack erp-grace, alias bakedata.local).
#
# Mismo origen que el SPA → sin CORS ni cookies cross-site. Réplica del proxy de
# Vite usado en dev (Host=bakedata.local, cookieDomainRewrite).

server {
    listen 80;
    server_tokens off;
    server_name _;
    root  /usr/share/nginx/html;
    index index.html;

    # DNS embebido de Docker → resuelve el alias bakedata.local en runtime.
    resolver 127.0.0.11 valid=30s;

    client_max_body_size 25m;

    # Cabeceras de seguridad del DOCUMENTO. Las respuestas de /api las manda el
    # nginx de ERPNext y ya vienen con las suyas; el HTML del SPA no traía ninguna.
    # `always` para que también salgan en errores. OJO nginx: un `add_header` en
    # un location REEMPLAZA los heredados, por eso se repiten abajo.
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    # Solo surte efecto sobre HTTPS (Caddy); el navegador la ignora en HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


    # API / archivos / assets de ERPNext / realtime → backend.
    # (El SPA emite sus propios assets en /static, no choca con /assets de ERPNext.)
    location ~ ^/(api|files|private|assets|socket\.io)/ {
        set $erp_backend http://bakedata.local:8080;
        proxy_pass $erp_backend;

        proxy_set_header Host              bakedata.local;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Reescribe el dominio de la cookie de sesión al host que usó el navegador.
        proxy_cookie_domain bakedata.local $host;

        # WebSocket (socket.io / realtime)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Impresión: proxy al print-server del HOST de la torre (impresora térmica USB).
    # El navegador llama /print/... (mismo origen) → aquí se reenvía al host:6789.
    # host.docker.internal lo provee compose vía extra_hosts (host-gateway).
    location /print/ {
        proxy_pass http://host.docker.internal:6789/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Assets con hash en el nombre (index-BjXXpjGN.js): el contenido NUNCA cambia
    # bajo el mismo nombre, un build nuevo emite otro hash. Cachear a un año.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA: cualquier ruta del cliente cae a index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html es el índice que apunta al bundle con hash: si se cachea, el
    # deploy queda invisible. Sin Cache-Control nginx solo manda Last-Modified y
    # el navegador aplica caché heurística — servía el bundle viejo sin siquiera
    # preguntar. "no-cache" no prohíbe cachear: obliga a revalidar, y con el ETag
    # la respuesta normal es un 304 vacío.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
